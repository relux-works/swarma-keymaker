name: Linux Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Release provenance controls inspect parent trees, including PR merges.
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
      - name: Prepare private test scratch
        id: scratch
        run: |
          python3 - <<'PY'
          import errno
          import json
          import os
          import shutil
          import stat
          import tempfile

          def protected(path):
              if not os.path.isabs(path) or os.path.normpath(path) != path or "\n" in path or "\r" in path:
                  raise ValueError("scratch ancestry must be absolute and canonical")
              parts = path.removeprefix("/").split("/") if path != "/" else []
              if len(parts) > 64:
                  raise ValueError("scratch ancestry exceeds diagnostic bound")
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
              fd = os.open("/", flags)
              prefix = "/"
              try:
                  for part in [None, *parts]:
                      if part is not None:
                          prefix = os.path.join(prefix, part)
                          child = os.open(part, flags, dir_fd=fd)
                          os.close(fd)
                          fd = child
                      info = os.fstat(fd)
                      acls = []
                      for name in ("system.posix_acl_access", "system.posix_acl_default"):
                          try:
                              os.getxattr(fd, name)
                          except OSError as error:
                              if error.errno not in (errno.ENODATA, errno.ENOTSUP):
                                  raise
                          else:
                              acls.append(name)
                      print(json.dumps({"scratch_ancestor": prefix, "uid": info.st_uid,
                                        "gid": info.st_gid, "mode": f"{stat.S_IMODE(info.st_mode):04o}",
                                        "acls": acls}), flush=True)
                      if info.st_uid not in (0, os.geteuid()) or info.st_mode & 0o022 or acls:
                          raise ValueError(f"unsafe scratch ancestry: {prefix}")
              except OSError as error:
                  raise RuntimeError(f"scratch ancestry inspection failed at {prefix}: errno={error.errno}") from error
              finally:
                  os.close(fd)

          # A private child cannot repair unsafe RUNNER_TEMP ancestors. Validate
          # the actual HOME first; never change an existing ancestor's permissions.
          home = os.environ["HOME"]
          protected(home)
          scratch = tempfile.mkdtemp(prefix="keymaker.", dir=home)
          try:
              protected(scratch)
              info = os.stat(scratch, follow_symlinks=False)
              if info.st_uid != os.geteuid() or stat.S_IMODE(info.st_mode) != 0o700:
                  raise ValueError("scratch child must be holder-owned0700")
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write(f"TMPDIR={scratch}\n")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"path={scratch}\n")
          except BaseException:
              shutil.rmtree(scratch)
              raise
          PY
      - name: Verify modules
        run: go mod verify
      - name: Check module tidiness
        run: go mod tidy -diff
      - name: Download offline fixture dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: bash --noprofile --norc -eo pipefail .github/scripts/check-format.sh
      - name: Check public hygiene
        run: python3 .github/scripts/check-hygiene.py
      - name: Verify CI controls
        run: |
          bash --noprofile --norc -eo pipefail .github/scripts/check-controls.sh
          bash --noprofile --norc -eo pipefail .github/scripts/check-pending-controls.sh
      # Compilation is not qualification. No PENDING test bodies execute here.
      - name: Compile tagged rows and report PENDING
        run: |
          go vet -tags multiuid ./internal/keymaker
          go vet -tags qualifiedtime ./internal/enrollment ./internal/registration ./internal/keymaker
          bash --noprofile --norc -eo pipefail .github/scripts/report-pending.sh
      - name: Test
        run: go test ./... -count=1 -timeout=25m -v
      - name: Remove private test scratch
        if: ${{ always() }}
        env:
          KEYMAKER_CI_SCRATCH: ${{ steps.scratch.outputs.path }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat

          scratch = os.environ.get("KEYMAKER_CI_SCRATCH", "")
          if scratch:
              home = os.environ["HOME"]
              if os.path.dirname(scratch) != home or not os.path.basename(scratch).startswith("keymaker."):
                  raise ValueError("refuse cleanup outside the prepared private child")
              info = os.lstat(scratch)
              if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.geteuid() or stat.S_IMODE(info.st_mode) != 0o700:
                  raise ValueError("refuse cleanup of changed scratch identity or permissions")
              shutil.rmtree(scratch)
          PY
